[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-studio-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "duckdb>=1.2,<2",
    "httpx>=0.28,<1",
    "tzdata>=2025.2",
    "keyring>=25,<26",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "hypothesis>=6", "ruff>=0.9", "mypy>=1.15", "types-PyYAML"]
mt5 = ["MetaTrader5>=5.0; sys_platform == 'win32'"]

[project.scripts]
oracle = "oracle.cli:main"

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["windows_live: requires Windows and the operator's real local MT5 terminal; never a fixture proof"]

[tool.hatch.build.targets.wheel]
packages = ["oracle"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
